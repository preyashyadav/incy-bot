[project]
name = "incident-copilot"
version = "0.1.0"
description = "Slack-native incident response copilot: investigates, proposes, and — once a human approves — remediates and verifies."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128",
    "uvicorn[standard]>=0.40",
    "pydantic>=2.12",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.46",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "slack-bolt>=1.21",
    "anthropic>=0.69",
    "structlog>=25.1",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "httpx>=0.28",
    "types-pyyaml>=6.0",
]

[project.scripts]
incident-worker = "incident_copilot.jobs.worker:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["incident_copilot*"]

[tool.setuptools.package-data]
"incident_copilot.api" = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["incident_copilot"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["slack_bolt.*", "slack_sdk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits a real external API; excluded from CI (run with -m live)",
]
addopts = "-m 'not live'"
