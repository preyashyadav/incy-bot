name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
          POSTGRES_DB: copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copilot -d copilot"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      ENVIRONMENT: ci
      DATABASE_URL: postgresql+psycopg://copilot:copilot@localhost:5432/copilot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check incident_copilot tests

      - name: Format check
        run: ruff format --check incident_copilot tests

      - name: Type check
        run: mypy

      - name: Migrate
        run: alembic upgrade head

      - name: Test
        run: pytest -q
