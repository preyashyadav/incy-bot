name: incident-copilot

services:
  postgres:
    # pgvector is not needed until phase 3, but baking it into the base image now means the
    # extension is available without a second image swap later.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
